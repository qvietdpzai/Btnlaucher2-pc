name: Release Stable

# Build full installers on all platforms when a version tag (v*) is pushed,
# then create a GitHub Release with every installer attached.
#
# This is the fork's self-contained release path: it only needs the default
# GITHUB_TOKEN (contents: write) and does not depend on the upstream Azure /
# npm / PAT secrets that the original XMCL release flow requires.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - name: Fix node-gyp and Python
        if: ${{ runner.os == 'macOS' || runner.os == 'Windows' }}
        run: python3 -m pip install --break-system-packages --user packaging setuptools
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"
      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache Vite deps
        uses: actions/cache@v5
        with:
          path: btnlauncher2-keystone-ui/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('pnpm-lock.yaml', 'btnlauncher2-keystone-ui/vite.config.ts') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Setup Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - name: Build
        run: |
          pnpm run --prefix btnlauncher2-keystone-ui build
          pnpm run --prefix btnlauncher2-electron-app build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          NODE_OPTIONS: --max-old-space-size=32768
          NODE_ENV: production
          # Produce full installers (dmg/zip/appx/deb/rpm/AppImage/tar.xz), not
          # just unpacked dirs. build.ts treats RELEASE=true as "package".
          RELEASE: "true"
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_TOKEN }}
          PUBLISHER: CN=BtnLauncher2
      - name: Upload Build
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ runner.os }}
          path: |
            btnlauncher2-electron-app/build/output/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build
        uses: actions/download-artifact@v7
        with:
          pattern: build-*
          merge-multiple: true
          path: build
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # Attach every packaged installer + metadata; skip blockmaps to keep
          # the release clean (they are only needed for delta updates).
          FILES=$(find build -maxdepth 1 -type f \
            \( -name "*.zip" -o -name "*.appx" -o -name "*.dmg" \
            -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \
            -o -name "*.tar.xz" -o -name "*.pacman" \
            -o -name "app-*.asar.gz" -o -name "manifest.json" \) \
            | sort)
          if [ -z "$FILES" ]; then
            echo "::error::No installer artifacts found in build/"
            find build -maxdepth 2 -type f | head -50
            exit 1
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" $FILES \
            --title "BtnLauncher2 $TAG" \
            --notes "BtnLauncher2 $TAG — Btn Minecraft Launcher." \
            --repo "${{ github.repository }}"

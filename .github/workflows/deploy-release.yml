name: Deploy Release
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Disabled on this fork: requires Azure + npm secrets not configured here.
    if: ${{ false }}
    steps:
    - name: Download Releases
      uses: robinraju/release-downloader@v1.7
      with:
        repository: "qvietdpzai/Btnlaucher2-pc"
        tag: ${{ github.event.release.tag_name }}
        fileName: "*"
        out-file-path: build
    - name: Upload to Azure
      uses: ci010/upload-blob-to-azure@master
      env:
        AZURE_ACCOUNT_KEY: ${{ secrets.AZURE_ACCOUNT_KEY }}
      with:
        account: btnlauncher2
        container: releases
        directory: ./build
    - name: Update Web Page
      uses: benc-uk/workflow-dispatch@v1
      with:
        workflow: Deploy
        token: ${{ secrets.PAT_GITHUB_TOKEN }}
        ref: 'master'
        repo: 'qvietdpzai/Btnlaucher2-pc'
    - name: Create release version file
      run: |
        mkdir releases
        echo ${{ github.event.release.tag_name }} > ./releases/VERSION
        cat << EOF > ./releases/latest_version.json
        ${{ toJSON(github.event.release) }}
        EOF
    - name: Upload release version file to Azure
      uses: ci010/upload-blob-to-azure@master
      env:
        AZURE_ACCOUNT_KEY: ${{ secrets.AZURE_ACCOUNT_KEY }}
      with:
        account: btnlauncher2
        container: releases
        directory: ./releases

  publish-asar-npm:
    name: Publish app.asar to npm
    runs-on: ubuntu-latest
    # Disabled on this fork: requires an npm token not configured here.
    if: ${{ false }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - uses: pnpm/action-setup@v6
    - name: Download asar bundles
      uses: robinraju/release-downloader@v1.7
      with:
        repository: "qvietdpzai/Btnlaucher2-pc"
        tag: ${{ github.event.release.tag_name }}
        fileName: "app-*.asar.gz"
        out-file-path: build
    - name: Download asar checksums
      uses: robinraju/release-downloader@v1.7
      with:
        repository: "qvietdpzai/Btnlaucher2-pc"
        tag: ${{ github.event.release.tag_name }}
        fileName: "app-*.asar.sha256"
        out-file-path: build
    - name: Download manifest
      uses: robinraju/release-downloader@v1.7
      with:
        repository: "qvietdpzai/Btnlaucher2-pc"
        tag: ${{ github.event.release.tag_name }}
        fileName: "manifest.json"
        out-file-path: meta
    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22
        registry-url: 'https://registry.npmjs.org'
    - name: Build and publish per-platform packages
      run: |
        set -e
        VERSION="${{ github.event.release.tag_name }}"; VERSION="${VERSION#v}"
        ELECTRON=$(node -p "require('./meta/manifest.json').electron")
        for gz in build/app-"$VERSION"-*.asar.gz; do
          [ -f "$gz" ] || continue
          base=$(basename "$gz")                  # app-<ver>-<plat>.asar.gz
          plat=${base#app-"$VERSION"-}; plat=${plat%.asar.gz}
          dir="pkg/$plat"
          mkdir -p "$dir"
          # Store app.asar uncompressed; the npm tarball's own gzip compresses it.
          gunzip -c "$gz" > "$dir/app.asar"
          cp "build/app-$VERSION-$plat.asar.sha256" "$dir/app.asar.sha256"
          case "$plat" in
            win*) cp btnlauncher2-electron-app/icons/dark.ico "$dir/icon.ico" ;;
            mac*) cp btnlauncher2-electron-app/icons/dark.icns "$dir/icon.icns" ;;
          esac
          cp btnlauncher2-asar/README.md "$dir/README.md"
          node -e "const fs=require('fs');const pj=require('./btnlauncher2-asar/package.json');pj.name='@btnlauncher2/app-$plat';pj.version='$VERSION';pj.electron='$ELECTRON';fs.writeFileSync('$dir/package.json',JSON.stringify(pj,null,2))"
          echo "Publishing @btnlauncher2/app-$plat@$VERSION (electron $ELECTRON)"
          ( cd "$dir" && npm publish --access public )
        done
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

  notify:
    needs:
      - publish
    name: Notify Kook and discord
    runs-on: ubuntu-latest
    steps:
    - name: Publish Release Notification
      uses: voxelum/discord-kook-notify-action@main
      with:
        version: ${{ github.event.release.tag_name }}
        token: ${{ secrets.KOOK_BOT_TOKEN }}
        discord: ${{ secrets.DISCORD_WEBHOOK }}

  update-brew:
    needs: 
      - publish
    name: Update Brew
    runs-on: ubuntu-latest
    concurrency:
      group: update-brew-formula
      cancel-in-progress: false
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v5
      with:
        repository: qvietdpzai/Btnlaucher2-pc
        path: homebrew-btnlauncher2
        ref: master
        token: ${{ secrets.PAT_GITHUB_TOKEN }}
    - name: Synchronize formula repository
      working-directory: homebrew-btnlauncher2
      run: git pull --ff-only origin master
    - uses: actions/github-script@v8
      name: Update Brew Formula
      with: 
        result-encoding: string
        script: |
          const version = '${{ github.event.release.tag_name }}'.substring(1);
          const fs = require('fs');
          const text = `cask "btnlauncher2" do
            version "${version}"
            sha256 :no_check
            arch arm: "arm64", intel: "x86_64"

            on_arm do 
              url "https://github.com/qvietdpzai/Btnlaucher2-pc/releases/download/v${version}/btnlauncher2-${version}-arm64.dmg"
            end

            on_intel do
              url "https://github.com/qvietdpzai/Btnlaucher2-pc/releases/download/v${version}/btnlauncher2-${version}-x64.dmg"
            end

            name "Btn Minecraft Launcher"
            desc "An Open Source Minecraft Launcher with Modern UX. Provides a Disk Efficient way to manage all your Mods!"
            homepage "https://btnlauncher2.app"

            livecheck do
              url :url
              strategy :header_match
            end
            
            app "Btn Minecraft Launcher.app"

            zap trash: [
              "~/Applications/Btn Minecraft Launcher.app",
              "~/Library/Application Support/btnlauncher2",
              "~/Library/Preferences/btnlauncher2.plist",
              "~/Library/Saved Application State/btnlauncher2.savedState"
            ]
          end
          `
          fs.writeFileSync('./homebrew-btnlauncher2/Casks/btnlauncher2.rb', text);
    - name: Push to homebrew-btnlauncher2
      working-directory: homebrew-btnlauncher2
      run: |
        if [ -z "$(git status --porcelain)" ]; then
          echo "Formula already up to date."
          exit 0
        fi
        git config user.name ci010
        git config user.email cijhn@hotmail.com
        git add Casks/btnlauncher2.rb
        git commit -m "Bump btnlauncher2 to ${{ github.event.release.tag_name }}"
        git push origin HEAD:master

  update-winget:
    needs: 
      - publish
    name: Upload To winget
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Download Releases
        uses: robinraju/release-downloader@v1.8
        with:
          repository: "qvietdpzai/Btnlaucher2-pc"
          tag: ${{ github.event.release.tag_name }}
          fileName: "version"
      - uses: actions/github-script@v8
        name: Get Release Version
        id: version
        with: 
          result-encoding: string
          script: |
            return '${{ github.event.release.tag_name }}'.substring(1);
      - name: Update version env
        run: |
          echo "VERSION=$(cat ./version)" >> $env:GITHUB_ENV
      - name: Create winget PR
        run: |
          iwr https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update CI010.XMinecraftLauncher -u $Env:URL -v $Env:VERSION -t $Env:TOKEN --submit
        env:
          TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          URL: ${{ format('https://btnlauncher2-core-api.azurewebsites.net/api/appx?version={0}', steps.version.outputs.result) }}

  update-flatpak:
    needs:
      - publish
    name: Update Flatpak metadata
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
    steps:
      - name: Checkout flatpak-metadata
        uses: actions/checkout@v5
        with:
          repository: qvietdpzai/Btnlaucher2-pc
          path: flatpak-metadata
          token: ${{ secrets.PAT_GITHUB_TOKEN }}
      - name: Update version and metainfo
        working-directory: flatpak-metadata
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # `version` file: bare tag, e.g. v0.55.0
          echo "$TAG" > version

          # Prepend a new <release> entry inside the <releases> block of
          # the AppStream metainfo. Date format is ISO yyyy-MM-dd, taken
          # from the GitHub release publish timestamp.
          export DATE=$(date -u -d "${{ github.event.release.published_at }}" +%Y-%m-%d)
          node -e '
            const fs = require("fs");
            const file = "app.btnlauncher2.metainfo.xml";
            const tag = process.env.TAG;
            const date = process.env.DATE;
            const entry =
              `    <release version="${tag}" date="${date}">\n` +
              `      <url>https://github.com/qvietdpzai/Btnlaucher2-pc/releases/tag/${tag}</url>\n` +
              `    </release>`;
            let xml = fs.readFileSync(file, "utf8");
            if (xml.includes(`version="${tag}"`)) {
              console.log("Release entry for " + tag + " already present.");
              process.exit(0);
            }
            // Insert immediately after the opening <releases> tag so the
            // newest release stays at the top.
            xml = xml.replace(/(<releases>\s*\n)/, `$1${entry}\n`);
            fs.writeFileSync(file, xml);
          '
      - name: Commit and push
        working-directory: flatpak-metadata
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Metadata already up to date."
            exit 0
          fi
          git config user.name ci010
          git config user.email cijhn@hotmail.com
          git add version app.btnlauncher2.metainfo.xml
          git commit -m "Update metadata for ${{ github.event.release.tag_name }}"
          git push origin HEAD:main
      - name: Mirror GitHub release
        # The flatpak-metadata repo mirrors a release per launcher version,
        # which is what Flathub watches via the AppStream <releases> feed.
        working-directory: flatpak-metadata
        run: |
          if gh release view "${{ github.event.release.tag_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.event.release.tag_name }} already exists."
            exit 0
          fi
          gh release create "${{ github.event.release.tag_name }}" \
            --title "Release for btnlauncher2 - ${{ github.event.release.tag_name }}" \
            --notes "Update metadata for ${{ github.event.release.tag_name }}"

